name: Live Sources Check

on:
  # Run daily at 06:00 UTC to catch feed outages early
  schedule:
    - cron: "0 6 * * *"
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  # Also run on pushes that change source config
  push:
    paths:
      - "src/tidebreak/country_mappings.py"
      - "src/tidebreak/fetchers.py"
      - "tests/test_live_sources.py"

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run live source tests for all countries (threaded)
        env:
          TIDEBREAK_RUN_LIVE_TESTS: "1"
        run: |
          python -m pytest tests/test_live_sources.py::test_live_all_countries_return_articles -v \
            --tb=short \
            -o "addopts=" \
            --junitxml=results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          path: results.xml

